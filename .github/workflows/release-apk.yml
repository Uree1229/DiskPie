name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Test and build installable APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --stacktrace

      - name: Prepare release files
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$REQUESTED_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          apk="DiskPie-${tag}.apk"
          checksum="${apk}.sha256"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "$checksum"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK: ${{ steps.release.outputs.apk }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
        run: |
          notes="Android 8.0 이상에서 설치할 수 있는 DiskPie 개발 프리뷰 APK입니다. Assets에서 APK를 내려받으세요."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "DiskPie ${TAG#v}" \
              --notes "$notes"
          fi
